# The immediate peer is the rate-limit identity; forwarded IPs are not trusted.
limit_req_zone $binary_remote_addr zone=pawdrop_login:1m rate=5r/m;
server {
    listen 80;
    server_name _;
    # URL paths are bearer credentials. Do not log them.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 6m;
    client_body_timeout 15s;
    proxy_request_buffering on;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    location = /admin/login {
        client_max_body_size 8k;
        limit_req zone=pawdrop_login burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://app:3000;
    }
    location / {
        proxy_pass http://app:3000;
    }
}
